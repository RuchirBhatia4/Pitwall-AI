services:
  - type: web
    name: pitwall-ai-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENF1_USERNAME
        sync: false
      - key: OPENF1_PASSWORD
        sync: false
      - key: PITWALL_STORAGE_BACKEND
        value: csv
      - key: DATABASE_URL
        sync: false
